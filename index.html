<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #161b22;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: none !important;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #161b22;
            height: 100vh;
            /* FIX: hide instantly (no transition) so no white frame is
               ever visible mid-fade; only fade back IN smoothly. */
            opacity: 1;
            transition: opacity 150ms ease;
        }

        iframe.navigating {
            opacity: 0;
            transition: none;
        }

        /* FIX: visible feedback instead of a silently blank page on error */
        #errorBanner {
            display: none;
            padding: 12px 16px;
            background: #3d1f1f;
            color: #ffb4b4;
            font-size: 14px;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body>
    <div class="toolbar" style="display:none;">
        <input type="text" id="urlInput">
    </div>

    <div id="errorBanner"></div>
    <iframe id="browserFrame" title="Scramjet Browser"></iframe>

    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const iframe = document.getElementById("browserFrame");
        const errorBanner = document.getElementById("errorBanner");

        function showError(message) {
            errorBanner.textContent = message;
            errorBanner.style.display = "block";
        }

        // FIX: the Apps Script parent UI (Code.js/index.html) expects this
        // page to postMessage status updates ({type:'sj-status', state:...})
        // back to it. Without this, the parent never learns a page finished
        // loading and always hits its own 20s timeout, showing a spinner
        // and then a fake "TIMEOUT" error every single time, even though
        // the page actually loaded fine in the background.
        function notifyParent(payload) {
            try {
                window.parent.postMessage(Object.assign({ type: "sj-status" }, payload), "*");
            } catch (e) {
                // no parent, or parent gone; ignore
            }
        }

        // FIX: the internal /~/sj/{id}/{id}/<encoded-real-url>?$io=...&$rfs=...
        // form is Scramjet's own routing format, not something a user (or
        // the Apps Script address bar) should see. Unwrap it back to the
        // real URL.
        function unwrapProxyUrl(rawUrl) {
            try {
                const marker = "/~/sj/";
                const idx = rawUrl.indexOf(marker);
                if (idx === -1) return rawUrl;
                const rest = rawUrl.slice(idx + marker.length);
                const parts = rest.split("/");
                if (parts.length < 3) return rawUrl;
                let encodedTarget = parts.slice(2).join("/");
                const qIdx = encodedTarget.indexOf("?");
                if (qIdx !== -1) encodedTarget = encodedTarget.slice(0, qIdx);
                return decodeURIComponent(encodedTarget);
            } catch (e) {
                return rawUrl;
            }
        }

        // FIX: the Apps Script parent UI already has a handler for
        // {state:'meta', title, favicon} (used to show the tab's real title
        // and site icon), but nothing on this side ever sent it -- tabs
        // always just showed the bare hostname. Read it from the proxied
        // document once it's loaded.
        function extractMeta(doc, realUrl) {
            let title = null;
            let favicon = null;
            try { title = (doc && doc.title) || null; } catch (e) { /* ignore */ }
            try {
                const origin = new URL(realUrl).origin;
                const iconLink = doc && doc.querySelector('link[rel~="icon"], link[rel="shortcut icon"]');
                const href = iconLink && iconLink.getAttribute('href');
                favicon = href ? new URL(href, origin).href : (origin + '/favicon.ico');
            } catch (e) { /* ignore */ }
            return { title, favicon };
        }

        let currentFrame = null;

        // FIX: validate with the URL constructor instead of a naive
        // startsWith("http") check, which also matches malformed schemes
        // like "httpxyz://...".
        function norm(u) {
            try {
                return new URL(u).href;
            } catch {
                try {
                    return new URL("https://" + u).href;
                } catch {
                    return null;
                }
            }
        }

        let hasStarted = false;

        async function init() {
            if (hasStarted) return;
            hasStarted = true;

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const targetUrlParam = urlParams.get('url');
                // GAS 側で発行したセッショントークン。wisp 接続時に Render がこれを
                // GAS に問い合わせて検証するため、必ず一緒に渡す。
                const authToken = urlParams.get('t') || '';

                if (!targetUrlParam) {
                    return;
                }

                const targetUrl = norm(targetUrlParam);
                if (!targetUrl) {
                    showError(`Invalid URL: ${targetUrlParam}`);
                    return;
                }

                // FIX: navigator.serviceWorker.ready was awaited twice
                // (once here, once inline below). One await is enough.
                const registration = await navigator.serviceWorker.ready;
                const serviceworker = navigator.serviceWorker.controller || registration.active;

                const transport = new EpoxyTransport({
                    wisp: "wss://scramjet-server.onrender.com/wisp/?t=" + encodeURIComponent(authToken)
                });

                await transport.init();

                const scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                const frame = scramjet.createFrame(iframe);
                currentFrame = frame;

                // FIX v3: frame.addEventListener does not exist in this
                // build (Frame only has go/back/forward/reload). Since the
                // proxied content is served same-origin, we can reach into
                // iframe.contentWindow directly and hook "beforeunload" to
                // know when a navigation is starting, instead of relying on
                // a Scramjet-level "navigate" event that this version
                // doesn't provide.
                let showTimer = null;

                function attachUnloadHook() {
                    try {
                        iframe.contentWindow.addEventListener("beforeunload", () => {
                            clearTimeout(showTimer);
                            iframe.classList.add("navigating");
                            notifyParent({ state: "loading", stage: "読み込み中..." });
                        });
                    } catch (e) {
                        // cross-origin or not yet available; ignore
                    }
                }

                iframe.addEventListener("load", () => {
                    clearTimeout(showTimer);
                    showTimer = setTimeout(() => {
                        iframe.classList.remove("navigating");
                    }, 150);

                    // Re-hook beforeunload on the new document so the
                    // *next* navigation is caught too.
                    attachUnloadHook();

                    let liveUrl = targetUrl;
                    try {
                        liveUrl = iframe.contentWindow.location.href;
                    } catch (e) {
                        // ignore, fall back to targetUrl
                    }
                    const realUrl = unwrapProxyUrl(liveUrl);
                    notifyParent({ state: "loaded", url: realUrl });

                    try {
                        const meta = extractMeta(iframe.contentDocument, realUrl);
                        if (meta.title || meta.favicon) {
                            notifyParent({ state: "meta", title: meta.title, favicon: meta.favicon });
                        }
                    } catch (e) {
                        // cross-origin or otherwise unreadable; skip silently
                    }
                });

                attachUnloadHook();
                notifyParent({ state: "loading", stage: "接続先ページを準備中..." });

                frame.go(targetUrl);

            } catch (e) {
                // FIX: surface errors to the user instead of only logging
                // to the console, so a failed wisp connection or SW
                // registration doesn't just look like a blank page.
                console.error("Init error:", e);
                showError(`Failed to start: ${e.message || e}`);
                notifyParent({ state: "error", message: e.message || String(e) });
            }
        }

        // FIX: handle back/forward/reload commands sent by the Apps Script
        // parent UI via postMessage ({type:'sj-cmd', action:'back'|...}).
        window.addEventListener("message", (event) => {
            const data = event.data;
            if (!data || data.type !== "sj-cmd" || !currentFrame) return;
            if (data.action === "back") currentFrame.back();
            else if (data.action === "forward") currentFrame.forward();
            else if (data.action === "reload") currentFrame.reload();
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(() => {
                init();
            }).catch((e) => {
                console.error("SW registration failed:", e);
                showError(`Service worker registration failed: ${e.message || e}`);
            });
        } else {
            showError("This browser does not support Service Workers, which Scramjet requires.");
        }
    </script>
</body>

</html>
